let currentDate = null;
let selectedDealers = new Set();
let finalData = [];

// 🟢 Set Date
function createNewDate() {

    let pickedDate = document.getElementById("datePicker").value;

    if (!pickedDate) {
        alert("Select date first");
        return;
    }

    currentDate = new Date(pickedDate).toLocaleDateString('en-GB');

    document.getElementById("currentDate").innerText =
        "Selected Date: " + currentDate;

    selectedDealers.clear();
    document.getElementById("results").innerHTML = "";
}

// 🔍 SEARCH
function searchData() {

    let query = document.querySelector(".search").value.toLowerCase();

    let resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";

    let filtered = data
        .map((d, index) => ({ ...d, index }))
        .filter(d =>
            d["Dealer Firm/ Site Name /Influencer Name"]
            .toLowerCase()
            .includes(query)
        );

    filtered.forEach(dealer => {

        let div = document.createElement("div");

        div.className = "search-item";

        div.innerHTML = `
            <span>
                ${dealer["Dealer Firm/ Site Name /Influencer Name"]}
                (${dealer["Contact Person"] || "No Contact"})
            </span>

            <input type="checkbox"
                   onchange="toggleDealer(${dealer.index}, this)">
        `;

        resultsDiv.appendChild(div);
    });
}

// ✅ Toggle selection
function toggleDealer(index, checkbox) {

    if (checkbox.checked) {
        selectedDealers.add(index);
    }
    else {
        selectedDealers.delete(index);
    }
}

// ➕ Add Data
function addData() {

    if (!currentDate) {
        alert("Click New Date first");
        return;
    }

    if (selectedDealers.size === 0) {
        alert("Select at least one dealer");
        return;
    }

    let selectedObjects =
        Array.from(selectedDealers).map(i => data[i]);

    finalData.push({
        date: currentDate,
        dealers: selectedObjects
    });

    selectedDealers.clear();

    document.querySelector(".search").value = "";

    document.getElementById("results").innerHTML = "";

    displayData();
}

// 👁️ Display
function displayData() {

    let view = document.getElementById("view");

    view.innerHTML = "";

    finalData.forEach(item => {

        let block = document.createElement("div");

        block.className = "date-block";

        let html = `<b>${item.date}</b><br>`;

        item.dealers.forEach(d => {

            html += `
                &nbsp;&nbsp;&nbsp;
                ${d["Dealer Firm/ Site Name /Influencer Name"]}
                <br>
            `;
        });

        block.innerHTML = html;

        view.appendChild(block);
    });
}

// 📥 Excel Download
function downloadExcel() {

    if (finalData.length === 0) {
        alert("No data");
        return;
    }

    let excelData = [];

    finalData.forEach(item => {

        item.dealers.forEach((dealer, index) => {

            excelData.push({

                Date: index === 0 ? item.date : "",

                Dealer:
                    dealer["Dealer Firm/ Site Name /Influencer Name"],

                Contact:
                    dealer["Contact Person"],

                Location:
                    dealer["Location"],

                District:
                    dealer["District"],

                Mobile:
                    dealer["Contact no."],

                Status:
                    dealer["Status of Contact Person"],

                VisitType:
                    dealer["Visit With Incharge/Dist./Self"],

                Brands:
                    dealer["Brands available at Shop"],

                Remarks:
                    dealer["Remarks "]
            });
        });
    });

    let worksheet =
        XLSX.utils.json_to_sheet(excelData);

    let workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Dealers"
    );

    XLSX.writeFile(
        workbook,
        "Dealer_Visits.xlsx"
    );
}
